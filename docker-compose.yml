services:
  # ---------------- Kafka (KRaft, single node, no Zookeeper) ----------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: saga2_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ---------------- Postgres (logical WAL so Debezium can tail it) ----------------
  postgres:
    image: postgres:16
    container_name: saga2_postgres
    environment:
      POSTGRES_USER: saga
      POSTGRES_PASSWORD: saga
      POSTGRES_DB: postgres
    command: >
      postgres -c wal_level=logical
               -c max_replication_slots=8
               -c max_wal_senders=8
    ports:
      - "5432:5432"
    volumes:
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------- Kafka Connect + Debezium (reads outbox -> Kafka) ----------------
  connect:
    image: debezium/connect:2.7.3.Final
    container_name: saga2_connect
    ports:
      - "8083:8083"        
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      - kafka
      - postgres

  # ---------------- Tracing ----------------
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: saga2_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"      
      - "4317:4317"       

  # ---------------- Services (one image, different command) ----------------

  orchestrator-api:
    build: .
    image: saga2-app
    command: uvicorn services.orchestrator.api:app --host 0.0.0.0 --port 8000
    restart: on-failure
    environment: &otel
      ORCHESTRATOR_DSN: postgresql://saga:saga@postgres:5432/orchestrator
      KAFKA_BOOTSTRAP: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }

  orchestrator-consumer:
    build: .
    image: saga2-app
    command: python -m services.orchestrator.consumer
    restart: on-failure
    environment: *otel
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  inventory:
    build: .
    image: saga2-app
    command: python -m services.inventory.main
    restart: on-failure
    environment:
      INVENTORY_DSN: postgresql://saga:saga@postgres:5432/inventory
      KAFKA_BOOTSTRAP: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  payment:
    build: .
    image: saga2-app
    command: python -m services.payment.main
    restart: on-failure
    environment:
      PAYMENT_DSN: postgresql://saga:saga@postgres:5432/payment
      KAFKA_BOOTSTRAP: kafka:9092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

volumes:
  pg_data:
